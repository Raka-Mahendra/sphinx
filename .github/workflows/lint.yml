name: Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0

      - name: Install dependencies
        run: yarn --frozen-lockfile --ignore-scripts

      - name: Validate current commit (last commit) with commitlint
        run: npx commitlint --last --verbose

      - name: Test
        run: yarn test

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format-check

  # Issue #1: the release profile is compiled for the first time on a tag, so a
  # Windows PR job catches `cargo check --release` failures that `tauri dev` and
  # `cargo test` hide (e.g. `window.open_devtools()` behind `#[cfg(debug_assertions)]`).
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri's Linux build scripts locate webkit2gtk/gtk/appindicator through
      # pkg-config, so a stock ubuntu-latest runner cannot even run `cargo
      # clippy` without them. Source: https://v2.tauri.app/start/prerequisites/
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Release check
        working-directory: src-tauri
        run: cargo check --release

  # Issue #4: the TypeScript suite has Windows-specific path and symlink cases.
  # `yarn test` (run above on Linux) hangs on the Epic suites on Windows, so the
  # Windows job runs the sidecar suites and the Windows-sensitive subset instead.
  js-windows:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0

      - name: Install dependencies
        run: yarn --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format-check

      - name: Sidecar suites
        run: |
          yarn test:crash
          yarn test:torrent

      - name: Windows-sensitive tests
        run: >-
          node --import ./scripts/register-ts-node.mjs
          --test --test-timeout=90000
          "src/main/services/cloud-save/custom-path-approval-selection.test.ts"
          "src/main/services/cloud-save/custom-path.test.ts"
          "src/main/services/cloud-save/emulator-destination-store.test.ts"
          "src/main/services/cloud-save/emulator-manual-file-eligibility.test.ts"
          "src/main/services/cloud-save/retroarch-safe-move.test.ts"
          "src/main/services/cloud-save/retroarch-save-config.test.ts"
          "src/main/services/cloud-save/rpcs3-config-root.test.ts"
          "src/main/services/cloud-save/rpcs3-save-layout.test.ts"
          "src/main/services/cloud-save/rpcs3-save-scanner.test.ts"
          "src/main/services/cloud-save/rpcs3-savestate-restore.test.ts"
          "src/main/services/notifications/notification-icon.test.ts"
          "src/main/services/retroarch/retroarch-config-paths.test.ts"
          "src/main/services/retroarch/rom-archive.test.ts"
          "src/main/services/steam-integration/steam-installation.test.ts"
          "src/main/services/wine.test.ts"
          "scripts/*.test.mjs"
