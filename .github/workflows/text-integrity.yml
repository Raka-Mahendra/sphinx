name: Text Integrity

on:
  pull_request:
  # Keep this in sync with lint.yml: the default branch is `sphinx/main`, not
  # `main`, so filtering on `main` alone disabled the check on every push.
  push:
    branches:
      - sphinx/main
      - "release/**"

jobs:
  text-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Verify LF line endings
        run: |
          files_with_cr="$(git grep -Il $'\r' -- . || true)"

          if [ -n "$files_with_cr" ]; then
            echo "Tracked text files must use LF line endings. Files containing CR characters:"
            echo "$files_with_cr"
            exit 1
          fi

      - name: Verify LICENSE hash
        run: |
          expected="daf69d893e1c89f38ee09fccfb93a14f73ca47d1d2e0e835d1920b72a669b988"
          actual="$(sha256sum LICENSE | cut -d ' ' -f1)"

          if [ "$actual" != "$expected" ]; then
            echo "LICENSE hash changed."
            echo "Expected: $expected"
            echo "Actual:   $actual"
            exit 1
          fi
