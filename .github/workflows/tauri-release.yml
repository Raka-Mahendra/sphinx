name: Tauri Release

# Tauri builds and releases. The Electron workflow (`release.yml`) is kept until
# Fase 8 removes the Electron code path; this one owns everything tagged.
#
# Design, from PRD §4.E:
#   * tags only (`v*`), and only in this repository;
#   * `contents: write` is granted to the two jobs that touch the release, never
#     to the build job, so nothing else can publish;
#   * build first, then a **draft** release, then one final job publishes it —
#     no partially uploaded release can ever look like "latest";
#   * `latest.json` carries the Windows entry only; Linux follows in Fase 9;
#   * Authenticode signing is a no-op unless the certificate secret exists.

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.21.0"

jobs:
  # ---------------------------------------------------------------------------
  # Build. No release permissions; signing secrets are scoped to this job, so a
  # fork pull request (which cannot push a tag anyway) cannot publish. The job
  # runs in the `release-signing` environment, so a tag cannot be built or
  # signed until a required reviewer approves. `draft`/`publish` keep
  # `contents: write` but never receive the signing key.
  # ---------------------------------------------------------------------------
  build:
    if: github.repository == 'Raka-Mahendra/sphinx'
    name: Build (${{ matrix.target }})
    # Approval gate before any signing-capable step runs.
    environment:
      name: release-signing
    permissions:
      contents: read
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-pc-windows-msvc]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install Rust
        # Deliberately not pinned to a SHA: the ref after `@` selects the
        # toolchain (`stable`) because no `with: toolchain` is given.
        uses: dtolnay/rust-toolchain@stable

      # Fails the build before any artefact exists if the three version sources
      # disagree with the tag (PRD §4.E: "tes CI gagal bila ketiganya ≠ tag").
      - name: Check the version sources against the tag
        run: node scripts/bump-version.mjs --check "${{ github.ref_name }}"

      # Issue #5: `bundle.createUpdaterArtifacts` is `true`, so `cargo tauri
      # build` aborts with "Signing updater artifacts requires a private key"
      # when `TAURI_SIGNING_PRIVATE_KEY` is unset — but only after the renderer,
      # sidecar and native addon have all been built (~15 min of wasted runner
      # time). Fail here instead, naming the secret and the doc that explains it.
      # This is a presence check, not a key-validity check: the key is passwordless,
      # so `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` is intentionally unset and an
      # unset GitHub secret is passed as an empty string.
      - name: Require the updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error @"
          TAURI_SIGNING_PRIVATE_KEY is not set, so the updater bundle cannot be signed.
          Set TAURI_SIGNING_PRIVATE_KEY as a repository secret and make sure it
          matches plugins.updater.pubkey in src-tauri/tauri.conf.json.
          The updater key is passwordless, so TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          is intentionally unset; do not invent one.
          See docs/release.md sections 1, 3 and 9 (Issue #5).
          "@
            exit 1
          }

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      # `--ignore-scripts` skips `postinstall`, and the installer bundles
      # `../ludusavi` for cloud saves. Without this step the packaged app has no
      # ludusavi.exe and every backup fails at runtime.
      - name: Download ludusavi for the bundle
        run: node scripts/postinstall.cjs

      - name: Build the renderer and the sidecar
        run: |
          yarn build:renderer
          yarn build:sidecar
          yarn stage:sidecar-deps

      - name: Stage the Node binary for bundle.externalBin
        run: yarn stage:node

      # `hydra-native/` is a build artifact and is git-ignored, so without this
      # step the installer ships no torrent engine at all: the app would open,
      # the download button would fail, and nothing in the build would say so.
      # Building it here also copies the VC++ runtime DLLs the addon imports
      # next to it, which is what makes the installer work on a clean machine
      # without the Visual C++ redistributable (PRD §4.C).
      - name: Build the native torrent addon
        run: yarn build:native
        env:
          # No Electron binary is downloaded under `--ignore-scripts`, so the
          # addon's load test would wait for a runtime that never arrives.
          HYDRA_NATIVE_SKIP_LOAD_TEST: "1"

      - name: Verify the torrent resources are packageable
        run: yarn check:torrent-resources

      - name: Check whether an Authenticode certificate secret is present
        id: certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
          }

      # `signCommand` is not an input of tauri-action; it is Tauri config, so it
      # is injected with `--config <path>`. Writing a JSON config file avoids
      # interpolating secrets into shell strings or fighting PowerShell/argv
      # quoting. The command must contain `%1`, which Tauri replaces with the
      # path of the file to sign.
      # Source: https://v2.tauri.app/reference/config/#signcommand
      - name: Prepare Authenticode signing config
        if: steps.certificate.outputs.present == 'true'
        id: build-args
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.p12"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signConfigPath = Join-Path $env:RUNNER_TEMP "tauri-signing.json"
          $config = @{
            bundle = @{
              windows = @{
                signCommand = "signtool.exe sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f `"$certPath`" /p `"$env:WINDOWS_CERTIFICATE_PASSWORD`" %1"
              }
            }
          }
          $config | ConvertTo-Json -Depth 4 | Set-Content -Path $signConfigPath -Encoding UTF8
          "args=--config $signConfigPath" >> $env:GITHUB_OUTPUT

      - name: Build the bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign). Different key type from Authenticode:
          # see docs/release.md §"Two kinds of key".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Optional. This project's key is passwordless, so the secret is
          # intentionally absent; `|| ''` makes the empty value explicit and
          # guarantees Tauri receives an empty password rather than an unset
          # variable. Do not set a made-up password.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # Embedded into the shell by `option_env!` (PRD §4.F). The client ID
          # must not change after the first public release.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          # Build only: no tagName / releaseName / releaseId, so the action does
          # not create or upload to a release.
          # Source: https://github.com/tauri-apps/tauri-action (build-only mode)
          projectPath: .
          tauriScript: yarn tauri
          args: ${{ steps.build-args.outputs.args }}
          retryAttempts: 2

      - name: Publish the bundles as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundles
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  # ---------------------------------------------------------------------------
  # Draft release. Everything is built and signed before this job runs.
  # ---------------------------------------------------------------------------
  draft:
    if: github.repository == 'Raka-Mahendra/sphinx'
    name: Draft the release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundles
          path: bundles

      - name: Resolve the installer and its signature
        id: files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(bundles/*-setup.exe)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "Expected exactly one *-setup.exe in bundles/, found ${#bundles[@]}" >&2
            exit 1
          fi
          raw_bundle="${bundles[0]}"
          version="${GITHUB_REF_NAME#v}"
          target_bundle="bundles/sphinx-launcher_${version}_x64-setup.exe"
          if [ "$raw_bundle" != "$target_bundle" ]; then
            mv "$raw_bundle" "$target_bundle"
            mv "${raw_bundle}.sig" "${target_bundle}.sig"
          fi
          echo "bundle=$target_bundle" >> "$GITHUB_OUTPUT"
          echo "signature=${target_bundle}.sig" >> "$GITHUB_OUTPUT"

      - name: Build latest.json and SHA256SUMS
        run: |
          node scripts/make-update-manifest.mjs \
            --tag "${{ github.ref_name }}" \
            --bundle "${{ steps.files.outputs.bundle }}" \
            --sig "${{ steps.files.outputs.signature }}" \
            --out bundles/latest.json \
            --sha256-out bundles/SHA256SUMS

      # v3 runs on Node 24; v2.6.2 is the final v2 release, uses the Node 20
      # runtime GitHub deprecated, and is no longer maintained. The inputs and
      # the draft/finalize code paths this workflow uses are unchanged.
      # Checked 28 November 2026 against v3.0.4.
      - name: Create the draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: Sphinx Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bundles/*-setup.exe
            bundles/*-setup.exe.sig
            bundles/latest.json
            bundles/SHA256SUMS

  # ---------------------------------------------------------------------------
  # One job publishes, after every platform is on the draft.
  # ---------------------------------------------------------------------------
  publish:
    if: github.repository == 'Raka-Mahendra/sphinx'
    name: Publish the release
    needs: draft
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: false
          # The updater reads `releases/latest/download/latest.json`, so this
          # release must become `latest`; do not rely on the API default.
          make_latest: true
          tag_name: ${{ github.ref_name }}
