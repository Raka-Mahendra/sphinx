[package]
name = "sphinx-launcher"
version = "0.1.0"
description = "Sphinx Launcher — open-source desktop launcher for your game library"
authors = ["Raka Mahendra"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
# `rlib` only: the Tauri desktop template also lists `staticlib`/`cdylib` for the
# mobile entry point, and building those on the GNU target trips over the PE
# export-ordinal limit (`ld.exe: error: export ordinal too large`) because the
# `windows` crate generates tens of thousands of import stubs.
# PRD §4.A.1 is desktop-only, so they are left out.
name = "sphinx_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Off by default. `tauri dev` gets the inspector through `debug_assertions`;
# a release build keeps the devtools code out unless this feature is requested
# (`cargo build --release --features devtools`).
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
open = "5"
arboard = "3"
# `v1` restores the familiar Entry API (new / set_password / get_password /
# delete_credential) on top of the v4 credential-store ecosystem.
keyring = { version = "4", features = ["v1"] }
keepawake = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
overflow-checks = true

[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unwrap_in_result = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "warn"
float_cmp = "deny"
lossy_float_literal = "deny"
allow_attributes = "warn"
allow_attributes_without_reason = "deny"
